<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Versions — Jiraffe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@300;400;700&family=Permanent+Marker&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Theme extras — page-specific variables per theme (core palette lives in
       theme.css, shared by every page). */
    :root,
    [data-theme="amber"] {
      --sel-bg:rgba(255,212,85,0.07); --hover-bg:rgba(212,135,10,0.04); --row-border-soft:rgba(138,85,0,0.30); --dim-faint:rgba(138,85,0,0.50); --overlay:rgba(0,0,0,0.75); --scanline:rgba(0,0,0,0.07); --scanline-step:4px;
    }
    [data-theme="green"] {
      --sel-bg:rgba(157,255,176,0.08); --hover-bg:rgba(40,200,90,0.05); --row-border-soft:rgba(20,90,40,0.30); --dim-faint:rgba(63,208,106,0.40); --overlay:rgba(0,0,0,0.78); --scanline:rgba(0,0,0,0.14); --scanline-step:3px;
    }
    [data-theme="ice"] {
      --sel-bg:rgba(184,240,255,0.08); --hover-bg:rgba(40,150,200,0.05); --row-border-soft:rgba(20,80,110,0.30); --dim-faint:rgba(82,184,216,0.40); --overlay:rgba(0,8,16,0.78); --scanline:rgba(0,0,0,0.05); --scanline-step:6px;
    }
    [data-theme="paper"] {
      --sel-bg:rgba(120,90,30,0.10); --hover-bg:rgba(120,90,30,0.06); --row-border-soft:rgba(120,100,60,0.25); --dim-faint:rgba(122,106,69,0.50); --overlay:rgba(40,35,25,0.55); --scanline:rgba(0,0,0,0.015); --scanline-step:8px;
    }
    [data-theme="c64"] {
      --sel-bg:rgba(180,170,245,0.12); --hover-bg:rgba(150,135,230,0.14); --row-border-soft:rgba(120,105,196,0.30); --dim-faint:rgba(155,143,224,0.45); --overlay:rgba(18,10,55,0.80); --scanline:rgba(0,0,0,0.10); --scanline-step:3px;
    }
    [data-theme="board"] {
      --sel-bg:rgba(168,120,15,0.16); --hover-bg:rgba(90,65,35,0.10); --row-border-soft:rgba(90,65,35,0.22); --dim-faint:rgba(92,74,48,0.50); --overlay:rgba(40,30,18,0.55); --scanline:rgba(0,0,0,0); --scanline-step:8px;
    }
    [data-theme="board"] body {
      background-color:#c2a173;
      background-image:
        radial-gradient(circle at 18% 28%, rgba(108,74,40,0.22) 0 1.5px, transparent 2px),
        radial-gradient(circle at 63% 54%, rgba(92,60,28,0.18) 0 1.5px, transparent 2px),
        radial-gradient(circle at 82% 20%, rgba(132,96,56,0.20) 0 1.5px, transparent 2px),
        radial-gradient(circle at 40% 82%, rgba(88,56,26,0.20) 0 1.5px, transparent 2px),
        radial-gradient(circle at 90% 75%, rgba(120,86,48,0.16) 0 1.5px, transparent 2px);
      background-size:23px 23px,17px 17px,29px 29px,19px 19px,13px 13px;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text); font-family:var(--font); text-shadow:var(--glow,none);
      font-size:18px; padding:calc(20px + var(--frame-w, 0px)); line-height:1.6;
    }
    body::after {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
      background:repeating-linear-gradient(0deg,
        transparent, transparent calc(var(--scanline-step,4px)/2),
        var(--scanline) calc(var(--scanline-step,4px)/2), var(--scanline) var(--scanline-step,4px));
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:9998;
      border:var(--frame-w,0px) solid var(--frame-c,transparent);
    }

    header { margin-bottom:18px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
    h1 { color:var(--bright); font-size:28px; letter-spacing:2px; font-family:var(--font-display); text-transform:var(--case,none); min-width:320px; flex-shrink:0; }
    #updated { color:var(--dim-faint); font-size:14px; }
    #reload-btn {
      background:none; border:1px solid var(--border); color:var(--text); font-family:inherit;
      font-size:15px; padding:3px 10px; cursor:pointer; letter-spacing:1px;
    }
    #reload-btn:hover { border-color:var(--bright); color:var(--bright); }
    #reload-btn.spinning { color:var(--dim-faint); cursor:wait; }

    /* failure banner — same language as the Jenkins page */
    .banner {
      border:1px solid var(--red); background:rgba(240,88,88,0.08); color:var(--text);
      padding:12px 16px; margin-bottom:20px; font-size:17px; letter-spacing:0.5px;
      display:flex; align-items:center; gap:12px;
      animation:banner-flash 1.2s ease-in-out infinite;
    }
    .banner strong { color:var(--red); }
    @keyframes banner-flash {
      0%,100% { box-shadow:0 0 4px rgba(240,88,88,0.25); }
      50%     { box-shadow:0 0 16px rgba(240,88,88,0.6); }
    }
    .banner.ok { border-color:var(--green); background:rgba(110,212,100,0.06); animation:none; }
    .banner.ok strong { color:var(--green); }

    /* shared cross-page navbar */
    .page-nav { display:flex; gap:4px; flex-wrap:wrap; align-items:center; flex-shrink:0; }
    .page-nav a { color:var(--dim); text-decoration:none; font-size:15px; letter-spacing:1px; padding:4px 10px; border:1px solid transparent; }
    .page-nav a:hover { color:var(--bright); border-color:var(--border); }
    .page-nav a.active { color:var(--bright); border-color:var(--border); background:var(--sel-bg); }

    /* version matrix: one row per app — master's tag, then each environment */
    .scroll { overflow-x:auto; }
    .matrix { border-collapse:collapse; border:1px solid var(--border); }
    .matrix th, .matrix td {
      padding:10px 16px; text-align:left; white-space:nowrap; vertical-align:top;
      border-bottom:1px solid var(--row-border-soft);
    }
    .matrix thead th { color:var(--dim); font-size:14px; font-weight:normal; letter-spacing:1px; border-bottom-color:var(--border); }
    .matrix tbody th { color:var(--bright); font-weight:normal; letter-spacing:0.5px; }
    .matrix tbody tr:hover { background:var(--hover-bg); }
    .matrix .master { border-right:1px solid var(--border); color:var(--bright); }
    .matrix a { color:inherit; text-decoration:none; }
    .matrix a:hover .ver, .matrix .master a:hover { text-decoration:underline; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; background:var(--dim-faint); }
    .UP .dot   { background:var(--green); }
    .WARN .dot { background:var(--yellow); }
    .DOWN .dot { background:var(--red); animation:pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .current { color:var(--green); }   /* runs the commit master's tag points at */
    .ahead { color:var(--yellow); font-size:13px; margin-left:2px; }
    .failing { display:block; color:var(--red); font-size:13px; white-space:normal; max-width:220px; }
    .none { color:var(--dim-faint); }

    .note { color:var(--dim); font-size:13px; margin-top:10px; }
    .empty { color:var(--dim); font-size:15px; max-width:680px; line-height:1.5; }
    .empty code { color:var(--bright); }
  </style>
  <script src="theme.js"></script>
</head>
<body>

<header>
  <h1>📦 VERSIONS</h1>
  <nav class="page-nav">
    <a href="index.html">◆ DASHBOARD</a>
    <a href="time.html">⏱ TIMESHEET</a>
    <a href="worklog.html">💰 WORKLOG</a>
    <a href="leave.html">🌴 FERIE</a>
    <a href="jenkins.html">🔧 JENKINS</a>
    <a href="versions.html" class="active">📦 VERSIONS</a>
    <a href="copilot.html">🤖 COPILOT <span id="nav-copilot-total">–</span></a>
    <a href="backlog.html">🗒 BACKLOG</a>
    <a href="links.html">🔗 LINKS</a>
  </nav>
  <button id="reload-btn" onclick="load()">⟳ RELOAD</button>
  <span id="updated"></span>
</header>

<div id="content">Asking every environment…</div>

<script>
const el = id => document.getElementById(id);
const BASE_TITLE = 'Versions — Jiraffe';
const BAD = new Set(['DOWN', 'OUT_OF_SERVICE']);

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// actuator/info's git.branch is `git describe`: v3.7.0.71-0-g6c19886a = tag,
// commits past it, abbreviated sha
function describe(v) {
  const m = /^(.+)-(\d+)-g([0-9a-f]+)$/.exec(v || '');
  return m ? {tag: m[1], ahead: +m[2], sha: m[3]} : {tag: v || '?', ahead: 0, sha: ''};
}
const plus = n => n ? `<span class="ahead">+${n}</span>` : '';

function masterCell(app, stash) {
  const m = app.master || {};
  if (!m.tag) return `<td class="master none" title="${esc(m.error)}">?</td>`;
  const [project, slug] = app.repo.split('/');
  const href = `${stash}/projects/${project}/repos/${slug}/commits/${m.commit}`;
  const tip = m.commit.slice(0, 10) + (m.ahead ? ` — master is ${m.ahead} commit${m.ahead > 1 ? 's' : ''} past this tag` : '');
  return `<td class="master"><a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(tip)}">${esc(m.tag)}${plus(m.ahead)}</a></td>`;
}

function envCell(app, env, s) {
  if (s.absent) return `<td class="none" title="not deployed in ${esc(env.toUpperCase())} (no such host)">–</td>`;
  const d = describe(s.version);
  const state = s.error || BAD.has(s.health) ? 'DOWN' : s.health === 'UP' ? 'UP' : 'WARN';
  const current = d.sha && (app.master?.commit || '').startsWith(d.sha);
  const tip = s.error ? `no answer — ${s.error}` : `${s.version} · health ${s.health}`;
  const text = s.error && !s.version ? 'no answer' : esc(d.tag) + plus(d.ahead);
  const failing = s.failing?.length ? `<span class="failing">${s.failing.map(esc).join(', ')}</span>` : '';
  return `<td class="${state}"><a href="${esc(s.url)}/actuator/health" target="_blank" rel="noopener" title="${esc(tip)}">`
    + `<span class="dot"></span><span class="ver${current ? ' current' : ''}">${text}</span>${failing}</a></td>`;
}

function render(data) {
  const envs = data.envs || [], apps = data.apps || [];
  if (!apps.length) {
    document.title = BASE_TITLE;
    el('content').innerHTML = `<div class="empty">No apps configured. Add them to
      <code>secrets/config</code> as <code>VERSION_APPS</code> (one
      <code>Label|PROJECT/repoSlug|https://{env}.host</code> per line).</div>`;
    return;
  }
  const cells = apps.flatMap(a => envs.map(e => ({app: a.label, env: e, s: a.envs[e]})));
  const down = cells.filter(c => c.s.error || BAD.has(c.s.health));
  const answered = cells.some(c => c.s.health);

  // tab title carries the down count across tabs
  document.title = down.length ? `(${down.length}!) ${BASE_TITLE}` : BASE_TITLE;
  const banner = !answered
    ? `<div class="banner"><span style="font-size:22px">⚠</span>
        <span><strong>NO ENVIRONMENT ANSWERED</strong> — VPN down?</span></div>`
    : down.length
    ? `<div class="banner"><span style="font-size:22px">⚠</span>
        <span><strong>${down.length} DOWN</strong> — ${down.map(c => esc(`${c.app} ${c.env.toUpperCase()}`)).join(', ')}</span></div>`
    : `<div class="banner ok"><span style="font-size:20px">✓</span>
        <span><strong>Every environment UP</strong></span></div>`;

  const head = `<tr><th></th><th class="master">MASTER</th>${envs.map(e => `<th>${esc(e.toUpperCase())}</th>`).join('')}</tr>`;
  const rows = apps.map(a => `<tr><th>${esc(a.label)}</th>${masterCell(a, data.stash_url)}`
    + envs.map(e => envCell(a, e, a.envs[e])).join('') + `</tr>`).join('');
  el('content').innerHTML = banner
    + `<div class="scroll"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
    + `<div class="note"><span class="current">green</span> = same commit as master's tag ·
       <span class="ahead">+N</span> = commits past that tag · dot = /actuator/health (click a cell) · – = not deployed there</div>`;
}

async function load() {
  const btn = el('reload-btn');
  btn.classList.add('spinning');
  btn.textContent = '⟳ LOADING…';
  try {
    const r = await fetch('/api/versions', {cache: 'no-store'});
    if (!r.ok) throw new Error((await r.text()) || `HTTP ${r.status}`);
    render(await r.json());
    el('updated').textContent = 'loaded ' + new Date().toTimeString().slice(0, 8);
  } catch (e) {
    el('content').innerHTML = `<div class="empty">Could not load versions — ${esc(e.message)}</div>`;
  } finally {
    btn.classList.remove('spinning');
    btn.textContent = '⟳ RELOAD';
  }
}

load();
setInterval(() => { if (!document.hidden) load(); }, 60000);   // live lookups: only while the tab is being looked at
</script>
<script>
  (function () {
    function loadCopilotNav() {
      fetch('data/copilot.json', {cache:'no-store'}).then(r => r.json()).then(d => {
        const el = document.getElementById('nav-copilot-total');
        if (el) el.textContent = (d.my_month_total ?? 0).toLocaleString();
      }).catch(() => {});
    }
    loadCopilotNav();
    setInterval(loadCopilotNav, 5 * 60 * 1000);
  })();
</script>
</body>
</html>
