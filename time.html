<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timesheet — Jiraffe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@300;400;700&family=Permanent+Marker&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Theme extras — page-specific variables per theme (core palette lives in
       theme.css, shared by every page). */
    :root,
    [data-theme="amber"] {
      --sel-bg:          rgba(255,212,85,0.07);
      --hover-bg:        rgba(212,135,10,0.04);
      --row-border-soft: rgba(138,85,0,0.30);
      --dim-faint:       rgba(138,85,0,0.50);
      --overlay:         rgba(0,0,0,0.75);
      --scanline:        rgba(0,0,0,0.07);
      --scanline-step:   4px;
    }

    [data-theme="green"] {
      --sel-bg:          rgba(157,255,176,0.08);
      --hover-bg:        rgba(40,200,90,0.05);
      --row-border-soft: rgba(20,90,40,0.30);
      --dim-faint:       rgba(63,208,106,0.40);
      --overlay:         rgba(0,0,0,0.78);
      --scanline:        rgba(0,0,0,0.14);
      --scanline-step:   3px;
    }

    [data-theme="ice"] {
      --sel-bg:          rgba(184,240,255,0.08);
      --hover-bg:        rgba(40,150,200,0.05);
      --row-border-soft: rgba(20,80,110,0.30);
      --dim-faint:       rgba(82,184,216,0.40);
      --overlay:         rgba(0,8,16,0.78);
      --scanline:        rgba(0,0,0,0.05);
      --scanline-step:   6px;
    }

    [data-theme="paper"] {
      --sel-bg:          rgba(120,90,30,0.10);
      --hover-bg:        rgba(120,90,30,0.06);
      --row-border-soft: rgba(120,100,60,0.25);
      --dim-faint:       rgba(122,106,69,0.50);
      --overlay:         rgba(40,35,25,0.55);
      --scanline:        rgba(0,0,0,0.015);
      --scanline-step:   8px;
    }

    [data-theme="c64"] {
      --sel-bg:          rgba(180,170,245,0.12);
      --hover-bg:        rgba(150,135,230,0.14);
      --row-border-soft: rgba(120,105,196,0.30);
      --dim-faint:       rgba(155,143,224,0.45);
      --overlay:         rgba(18,10,55,0.80);
      --scanline:        rgba(0,0,0,0.10);
      --scanline-step:   3px;
    }

    [data-theme="board"] {
      --sel-bg:          rgba(168,120,15,0.16);
      --hover-bg:        rgba(90,65,35,0.10);
      --row-border-soft: rgba(90,65,35,0.22);
      --dim-faint:       rgba(92,74,48,0.50);
      --overlay:         rgba(40,30,18,0.55);
      --scanline:        rgba(0,0,0,0);
      --scanline-step:   8px;
    }

    /* Corkboard texture, shared with the dashboard's board theme. */
    [data-theme="board"] body {
      background-color: #c2a173;
      background-image:
        radial-gradient(circle at 18% 28%, rgba(108,74,40,0.22) 0 1.5px, transparent 2px),
        radial-gradient(circle at 63% 54%, rgba(92,60,28,0.18) 0 1.5px, transparent 2px),
        radial-gradient(circle at 82% 20%, rgba(132,96,56,0.20) 0 1.5px, transparent 2px),
        radial-gradient(circle at 40% 82%, rgba(88,56,26,0.20) 0 1.5px, transparent 2px),
        radial-gradient(circle at 90% 75%, rgba(120,86,48,0.16) 0 1.5px, transparent 2px);
      background-size: 23px 23px, 17px 17px, 29px 29px, 19px 19px, 13px 13px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      text-shadow: var(--glow, none);
      font-size: 18px;
      padding: calc(20px + var(--frame-w, 0px));
      line-height: 1.6;
    }

    /* CRT scanline + screen frame overlays — match the dashboard */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent, transparent calc(var(--scanline-step, 4px) / 2),
        var(--scanline) calc(var(--scanline-step, 4px) / 2), var(--scanline) var(--scanline-step, 4px)
      );
      pointer-events: none;
      z-index: 9999;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      border: var(--frame-w, 0px) solid var(--frame-c, transparent);
      pointer-events: none;
      z-index: 9998;
    }

    header { margin-bottom: 18px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
    h1 { color: var(--bright); font-size: 28px; letter-spacing: 2px; font-family: var(--font-display); text-transform: var(--case, none); min-width: 320px; flex-shrink: 0; }
    .nav-link { color: var(--dim); text-decoration: none; font-size: 16px; }
    .nav-link:hover { color: var(--bright); }
    .page-nav { display:flex; gap:4px; flex-wrap:wrap; align-items:center; flex-shrink:0; }
    .page-nav a { color:var(--dim); text-decoration:none; font-size:15px; letter-spacing:1px; padding:4px 10px; border:1px solid transparent; }
    .page-nav a:hover { color:var(--bright); border-color:var(--border); }
    .page-nav a.active { color:var(--bright); border-color:var(--border); background:var(--sel-bg); }

    #content { display: flex; flex-direction: column; }

    #main-row { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; }
    #main-col  { width: fit-content; }

    #daily-panel {
      width: 195px;
      flex-shrink: 0;
      position: sticky;
      top: 20px;
    }
    .daily-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--dim);
      font-size: 15px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .week-nav {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .week-nav:hover { color: var(--bright); }
    .week-nav:disabled { opacity: 0.2; cursor: default; }
    .day-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 0 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      height: 40px;
      box-sizing: border-box;
    }
    .day-box.today { border-color: var(--dim); }
    .day-box.selected { border-color: var(--bright); background: var(--sel-bg); }
    .day-label { color: var(--dim); font-size: 18px; white-space: nowrap; }
    .day-box.today .day-label { color: var(--bright); }
    .day-box.selected .day-label { color: var(--bright); }
    .day-total { color: var(--green); font-size: 18px; white-space: nowrap; }
    .day-total.empty { color: var(--dim-faint); }

    #day-filter-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--sel-bg);
      border: 1px solid var(--bright);
      padding: 6px 12px;
      margin-bottom: 12px;
      font-size: 15px;
      color: var(--bright);
      letter-spacing: 0.5px;
    }
    #day-filter-banner.hidden { display: none; }
    .filter-clear {
      background: none;
      border: none;
      color: var(--dim);
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      padding: 0 2px;
      margin-left: auto;
    }
    .filter-clear:hover { color: var(--bright); }
    .daily-week-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    #week-total-box .day-label { color: var(--text); font-size: 18px; }
    #week-total-box .day-total { color: var(--green); font-size: 18px; font-weight: bold; }

    .toolbar { margin-bottom: 16px; }

    #day-timeline-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 14px;
      margin-bottom: 16px;
    }
    .day-timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      font-size: 14px;
      letter-spacing: 1px;
    }
    #day-timeline-label { color: var(--dim); }
    #day-timeline-gaps-summary { color: var(--yellow); font-size: 13px; }
    #day-timeline-bar {
      display: flex;
      height: 26px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .tl-block { height: 100%; box-sizing: border-box; border-right: 1px solid var(--bg); }
    .tl-block:last-child { border-right: none; }
    .tl-tracked { background: var(--green); opacity: 0.55; }
    .tl-idle    { background: var(--yellow); opacity: 0.4; }
    .tl-gap {
      background: repeating-linear-gradient(45deg, var(--red) 0, var(--red) 4px, transparent 4px, transparent 8px);
      opacity: 0.6;
      cursor: pointer;
    }
    .tl-gap:hover { opacity: 0.9; }
    .tl-range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--dim-faint);
      font-size: 12px;
      margin-top: 3px;
    }
    .tl-gap-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      font-size: 13px;
      color: var(--text);
      border-left: 2px solid var(--red);
      margin-top: 4px;
      cursor: pointer;
      background: var(--hover-bg);
    }
    .tl-gap-row:hover { color: var(--bright); border-left-color: var(--bright); }
    .tl-gap-dur { color: var(--red); white-space: nowrap; margin-left: 10px; }
    .timeline-empty { color: var(--dim); font-size: 13px; padding: 4px 0; }

    .btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      padding: 5px 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    .btn:hover { border-color: var(--bright); color: var(--bright); }

    .tracker-item {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 2px;
    }

    .tracker-header {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .tracker-header:hover { background: var(--hover-bg); border-radius: 2px; }

    .tracker-toggle { margin-right: 6px; color: var(--dim); font-size: 14px; width: 12px; display: inline-block; }
    .tracker-segments.collapsed { display: none; }

    .tracker-key { color: var(--bright); font-size: 20px; font-weight: bold; white-space: nowrap; }
    .tracker-summary { color: var(--text); font-size: 18px; white-space: nowrap; }
    .tracker-total { color: var(--green); font-size: 22px; font-weight: bold; white-space: nowrap; margin-left: auto; padding-left: 16px; }

    .tracker-segments {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--row-border-soft);
      font-size: 18px;
      color: var(--dim);
    }

    .segment {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      gap: 12px;
    }
    .segment:hover { background: var(--hover-bg); }
    .segment-range { flex: 1; }
    .segment-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .segment-time { color: var(--text); font-size: 18px; min-width: 90px; text-align: right; }

    .seg-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: inherit;
      font-size: 15px;
      padding: 1px 7px;
      cursor: pointer;
    }
    .seg-btn:hover { color: var(--bright); border-color: var(--bright); }
    .seg-btn.del:hover { color: var(--red); border-color: var(--red); }

    .add-entry-btn {
      background: none;
      border: 1px dashed var(--border);
      color: var(--dim);
      font-family: inherit;
      font-size: 15px;
      padding: 3px 10px;
      cursor: pointer;
      margin-top: 8px;
    }
    .add-entry-btn:hover { color: var(--green); border-color: var(--green); }

    /* inline forms */
    .seg-form { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
    .seg-form input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 16px;
      padding: 3px 6px;
      color-scheme: dark;
    }
    .seg-form input[type="text"] { min-width: 150px; }
    .seg-form input:focus { outline: none; border-color: var(--bright); }
    .seg-form .arrow { color: var(--dim); }
    .form-err { color: var(--red); font-size: 15px; margin-left: 4px; }


    .empty { color: var(--dim); padding: 20px; text-align: center; }
    .idle-tracker { opacity: 0.75; }

    #active-banner {
      background: rgba(110,212,100,0.06);
      border: 1px solid var(--green);
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    #active-banner.hidden { display: none !important; }
    .active-label { color: var(--dim); font-size: 14px; letter-spacing: 1px; }
    .active-key   { color: var(--bright); font-size: 20px; font-weight: bold; }
    .active-elapsed { color: var(--green); font-size: 22px; font-weight: bold; min-width: 80px; }
    .btn-stop {
      background: none;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: inherit;
      font-size: 16px;
      padding: 5px 14px;
      cursor: pointer;
      letter-spacing: 0.5px;
      margin-left: auto;
    }
    .btn-stop:hover { background: rgba(240,88,88,0.1); }
    .track-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      padding: 2px 5px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .track-btn:hover { color: var(--bright); border-color: var(--bright); }
    .track-btn.active { color: var(--bright); border-color: var(--bright); animation: blink 1.2s step-start infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* Jira sync modal */
    #jira-modal {
      position: fixed; inset: 0;
      background: var(--overlay);
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 8vh; z-index: 100;
    }
    #jira-modal.hidden { display: none; }
    .jira-modal-box {
      background: var(--panel);
      border: 1px solid var(--bright);
      padding: 18px 22px;
      max-width: 760px; width: 92%;
      max-height: 75vh; overflow-y: auto;
    }
    .sync-row { display: flex; gap: 14px; padding: 3px 0; font-size: 16px; align-items: baseline; }
    .sync-date { color: var(--dim); white-space: nowrap; }
    .sync-key { color: var(--bright); min-width: 180px; }
    .sync-local { min-width: 90px; text-align: right; color: var(--text); white-space: nowrap; }
    .sync-state-unwritten { color: var(--yellow); }
    .sync-state-changed   { color: var(--yellow); }
    .sync-state-synced    { color: var(--green); }
    .sync-state-conflict  { color: var(--red); }
    .sync-state-orphaned  { color: var(--red); }
    .sync-state-error     { color: var(--red); }
    .sync-action-created, .sync-action-updated { color: var(--green); }
    .sync-action-skipped { color: var(--dim); }
    .sync-action-conflict, .sync-action-orphaned, .sync-action-error { color: var(--red); }
    .day-mark-synced  { color: var(--green); }
    .day-mark-pending { color: var(--yellow); }
    #filter-statusbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 20px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }
    #filter-statusbar.active { color: var(--bright); border-top-color: var(--bright); }
    #filter-statusbar.hidden { display: none; }
  </style>
  <script src="theme.js"></script>
</head>
<body>

<header>
  <h1>⏱ TIMESHEET</h1>
  <nav class="page-nav">
    <a href="index.html">◆ DASHBOARD</a>
    <a href="time.html" class="active">⏱ TIMESHEET</a>
    <a href="worklog.html">💰 WORKLOG</a>
    <a href="leave.html">🌴 FERIE</a>
    <a href="jenkins.html">🔧 JENKINS</a>
    <a href="copilot.html">🤖 COPILOT <span id="nav-copilot-total">–</span></a>
  </nav>
</header>

<div id="content">
  <div id="main-row">
    <div id="main-col">
      <div id="active-banner" class="hidden">
        <span class="active-label">TRACKING</span>
        <span class="active-key" id="active-key">–</span>
        <span class="active-elapsed" id="active-elapsed">0:00</span>
        <button class="btn-stop" onclick="stopTracking()">■ Stop</button>
      </div>
      <div class="toolbar">
        <button class="btn" onclick="openNewEntry()">+ New entry</button>
        <button class="btn" onclick="openJiraSync()">⇄ Jira sync</button>
      </div>
      <div id="day-timeline-box">
        <div class="day-timeline-header">
          <span id="day-timeline-label">GAPS · TODAY</span>
          <span id="day-timeline-gaps-summary"></span>
        </div>
        <div id="day-timeline-bar"></div>
        <div id="day-timeline-range-labels" class="tl-range-labels"></div>
        <div id="day-timeline-gaps"></div>
      </div>
      <div id="new-entry"></div>
      <div id="day-filter-banner" class="hidden">
        <span id="day-filter-label"></span>
        <button class="seg-btn" onclick="openJiraSync()" title="Write tracked time for this selection to Jira">⇪ Write to Jira</button>
        <button class="filter-clear" onclick="clearDayFilter()" title="Clear filter (Esc)">✕ all entries</button>
      </div>
      <div id="trackers"></div>
    </div>
    <div id="daily-panel">
      <div class="daily-panel-header">
        <button class="week-nav" id="btn-prev-week" onclick="shiftWeek(-1)">‹</button>
        <span id="week-label">THIS WEEK</span>
        <span style="display:flex;gap:0">
          <button class="week-nav" id="btn-next-week" onclick="shiftWeek(1)" disabled>›</button>
          <button class="week-nav" id="btn-fast-forward" onclick="goToCurrentWeek()" style="display:none" title="Jump to current week">»</button>
        </span>
      </div>
      <div id="day-boxes"></div>
      <div id="week-total-box" class="daily-week-total" style="border:1px solid var(--border); padding:10px 12px; background:var(--panel); margin-top:10px; cursor:pointer;">
        <span class="day-label">WEEK</span>
        <span class="day-total" id="week-total-val">–</span>
      </div>
      <div class="daily-panel-header" style="margin-top:10px; margin-bottom:4px;">
        <button class="week-nav" id="btn-prev-month" onclick="shiftMonth(-1)">‹</button>
        <span id="month-nav-label" style="font-size:13px; letter-spacing:1px;">JUNE 2026</span>
        <span style="display:flex;gap:0">
          <button class="week-nav" id="btn-next-month" onclick="shiftMonth(1)" disabled>›</button>
          <button class="week-nav" id="btn-fast-forward-month" onclick="goToCurrentMonth()" style="display:none" title="Jump to current month">»</button>
        </span>
      </div>
      <div id="month-total-box" class="daily-week-total" style="border:1px solid var(--border); padding:8px 12px; background:var(--panel); cursor:pointer;" onclick="toggleMonthFilter()">
        <span class="day-label" id="month-label" style="color:var(--dim);">MONTH</span>
        <span class="day-total" id="month-total-val">–</span>
      </div>
      <div id="sprint-total-box" class="daily-week-total" style="border:1px solid var(--border); padding:8px 12px; background:var(--panel); margin-top:6px; cursor:pointer; display:none;" onclick="toggleSprintFilter()">
        <span class="day-label" id="sprint-label" style="color:var(--dim);">SPRINT</span>
        <span class="day-total" id="sprint-total-val">–</span>
      </div>
    </div>
  </div>
</div>

<div id="filter-statusbar" class="hidden"></div>

<div id="jira-modal" class="hidden" onmousedown="if(event.target.id==='jira-modal')closeJiraModal()">
  <div class="jira-modal-box" id="jira-modal-box"></div>
</div>

<script>
const IDLE_KEY = '__IDLE__';

let lastData   = null;
let jiraData   = null;
let liveTimer  = null;  // 1-second tick for the active-banner elapsed display
// openForm: null | {type:'edit', key, id} | {type:'add', key} | {type:'new'}
let openForm = null;
const expandedKeys = new Set();
let weekOffset = 0; // 0 = current week, -1 = last week, etc.
let monthOffset = 0; // 0 = current month, -1 = last month, etc.
let selectedDay = null; // localDateStr of the selected day, or null
let monthFilter = null; // "YYYY-MM" string, or null
let sprintFilter = false;

// ── formatting ────────────────────────────────────────────────────────────
function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${h}h ${m}m ${s}s`;
}

function formatDateTime(isoStr) {
  if (!isoStr) return '–';
  return new Date(isoStr).toLocaleString('da-DK', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// datetime-local value (local time) from an ISO string
function toInputValue(iso) {
  const d = iso ? new Date(iso) : new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// datetime-local value -> ISO (UTC); server normalizes to local offset
function inputToISO(val) {
  if (!val) return '';
  const d = new Date(val);
  if (isNaN(d.getTime())) return '';
  return d.toISOString();
}

// Mirror of server _round_quarter / worklog.html's roundQuarter: snap seconds
// to the nearest 15 min, rounding up only when >=5 min past a quarter, else
// down; any block with tracked time bills at least 15 min.
function roundQuarter(seconds) {
  let m = Math.floor(seconds / 60);
  if (m <= 0) return 0;
  const r = m % 15;
  m = r < 5 ? m - r : m + (15 - r);
  return Math.max(15, m) * 60;
}

// ── active banner ─────────────────────────────────────────────────────────
function computeElapsed() {
  const active = lastData?.active;
  if (!active) return 0;
  return Math.floor((Date.now() - new Date(active.started_at).getTime()) / 1000);
}

function formatElapsed(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function renderActiveBanner() {
  const banner  = document.getElementById('active-banner');
  const keyEl   = document.getElementById('active-key');
  const elapsed = document.getElementById('active-elapsed');
  const active  = lastData?.active;

  if (active) {
    keyEl.textContent = active.key === IDLE_KEY ? '⏸ IDLE' : active.key;
    elapsed.textContent = formatElapsed(computeElapsed());
    banner.classList.remove('hidden');
    if (!liveTimer) {
      liveTimer = setInterval(() => {
        const secs = computeElapsed();
        document.getElementById('active-elapsed').textContent = formatElapsed(secs);
        const totalEl = document.getElementById('active-tracker-total');
        if (totalEl) {
          const activeKey = lastData?.active?.key;
          const allSegs = lastData?.trackers?.[activeKey]?.segments || [];
          const weekRange = viewedWeekRange();
          const segs = selectedDay
            ? allSegs.filter(s => localDateStr(new Date(s.started_at)) === selectedDay)
            : monthFilter
              ? allSegs.filter(s => localDateStr(new Date(s.started_at)).startsWith(monthFilter))
              : sprintFilter
                ? allSegs.filter(s => { const sr = sprintDateRange(); const d = localDateStr(new Date(s.started_at)); return sr && d >= sr.start && d <= sr.end; })
                : allSegs.filter(s => { const d = localDateStr(new Date(s.started_at)); return d >= weekRange.start && d <= weekRange.end; });
          const baseSeconds = segs.reduce((sum, s) => sum + (s.seconds || 0), 0);
          totalEl.textContent = formatTime(baseSeconds + secs);
        }
        const segEl = document.getElementById('active-seg-time');
        if (segEl) segEl.textContent = formatTime(secs);
        if (weekOffset === 0) renderDailyPanel();
      }, 1000);
    }
  } else {
    banner.classList.add('hidden');
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  }
}

async function startTracking(key, summary) {
  try {
    await postTrack({action: 'start', key, summary});
  } catch(e) { console.error('startTracking:', e); }
}

async function stopTracking() {
  try {
    await postTrack({action: 'stop'});
    loadAndRender();
  } catch (e) { alert('Stop failed: ' + e.message); }
}

// ── API ───────────────────────────────────────────────────────────────────
async function postTrack(payload) {
  const resp = await fetch('/api/track', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (!resp.ok) throw new Error(await resp.text());
  return resp.json();
}

// ── form open/close ─────────────────────────────────────────────────────────
function openEdit(key, id)    { openForm = {type:'edit', key, id}; render(); }
function openAdd(key)         { openForm = {type:'add', key}; render(); }
function openNewEntry(start, end) { openForm = {type:'new', start, end}; render(); }
function openEditActive(key)  { openForm = {type:'edit_active', key}; render(); }
function cancelForm()         { openForm = null; loadAndRender(); }

async function saveEditActive(key) {
  const start = inputToISO(document.getElementById('f-active-start').value);
  if (!start) return showErr('Enter a start time');
  if (new Date(start) > new Date()) return showErr('Start time is in the future');
  try {
    await postTrack({action: 'edit_active', key, started_at: start});
    openForm = null; loadAndRender();
  } catch (e) { showErr(e.message); }
}

function showErr(msg) {
  const el = document.getElementById('form-err');
  if (el) el.textContent = msg;
}

async function saveEdit(key, id) {
  const start = inputToISO(document.getElementById('f-start').value);
  const end   = inputToISO(document.getElementById('f-end').value);
  if (!start || !end)   return showErr('Enter both start and end');
  if (new Date(end) <= new Date(start)) return showErr('End must be after start');
  try {
    await postTrack({action:'edit_segment', key, id, started_at:start, ended_at:end});
    openForm = null; loadAndRender();
  } catch (e) { showErr(e.message); }
}

async function saveAdd(key) {
  const start = inputToISO(document.getElementById('f-start').value);
  const end   = inputToISO(document.getElementById('f-end').value);
  if (!start || !end)   return showErr('Enter both start and end');
  if (new Date(end) <= new Date(start)) return showErr('End must be after start');
  try {
    await postTrack({action:'add_segment', key, started_at:start, ended_at:end});
    openForm = null; loadAndRender();
  } catch (e) { showErr(e.message); }
}

async function saveNew() {
  const key     = document.getElementById('f-key').value.trim();
  const summary = document.getElementById('f-summary').value.trim();
  const start = inputToISO(document.getElementById('f-start').value);
  const end   = inputToISO(document.getElementById('f-end').value);
  if (!key)             return showErr('Enter an issue key');
  if (!start || !end)   return showErr('Enter both start and end');
  if (new Date(end) <= new Date(start)) return showErr('End must be after start');
  try {
    await postTrack({action:'add_segment', key, summary, started_at:start, ended_at:end});
    openForm = null; loadAndRender();
  } catch (e) { showErr(e.message); }
}

async function delSeg(key, id) {
  if (!confirm(`Delete this time entry for ${key === IDLE_KEY ? 'Idle' : key}?`)) return;
  try {
    await postTrack({action:'delete_segment', key, id});
    openForm = null; loadAndRender();
  } catch (e) { alert('Delete failed: ' + e.message); }

// ── rendering ───────────────────────────────────────────────────────────────
function segFormHtml({withKey=false, onsave='', cancel='cancelForm()', start='', end=''} = {}) {
  const keyField = withKey
    ? `<input type="text" id="f-key" placeholder="ISSUE-123" autocomplete="off">

    <div class="seg-form" onkeydown="if(event.key==='Enter'){event.preventDefault();${onsave}}">

function render() {
  const data = lastData;
  if (!data) return;

  // top-level new-entry form
  document.getElementById('new-entry').innerHTML =
    (openForm && openForm.type === 'new')
      ? `<div class="tracker-item">${segFormHtml({withKey:true, onsave:'saveNew()', start: openForm.start ? toInputValue(openForm.start) : '', end: openForm.end ? toInputValue(openForm.end) : ''})}</div>`
      : '';

  renderDayTimeline();

  const trackers = data.trackers || {};
  const weekRange = viewedWeekRange();
  let keys = Object.keys(trackers).filter(k => k !== IDLE_KEY).sort();
  if (trackers[IDLE_KEY]) keys.push(IDLE_KEY);
  keys = keys.filter(k => {
    const segs = trackers[k]?.segments || [];
    const isActive = k === (lastData?.active?.key);
    if (selectedDay) {
      return segs.some(s => localDateStr(new Date(s.started_at)) === selectedDay)
        || (isActive && localDateStr(new Date(lastData.active.started_at)) === selectedDay);
    }
    if (monthFilter) {
      return segs.some(s => localDateStr(new Date(s.started_at)).startsWith(monthFilter))
        || (isActive && localDateStr(new Date(lastData.active.started_at)).startsWith(monthFilter));
    }
    if (sprintFilter) {
      const sr = sprintDateRange();
      if (!sr) return false;
      return segs.some(s => { const d = localDateStr(new Date(s.started_at)); return d >= sr.start && d <= sr.end; })
        || (isActive && (() => { const d = localDateStr(new Date(lastData.active.started_at)); return d >= sr.start && d <= sr.end; })());
    }
    return segs.some(s => { const d = localDateStr(new Date(s.started_at)); return d >= weekRange.start && d <= weekRange.end; })
      || (isActive && (() => { const d = localDateStr(new Date(lastData.active.started_at)); return d >= weekRange.start && d <= weekRange.end; })());
  });

  const trackersEl = document.getElementById('trackers');
  if (keys.length === 0) {
    trackersEl.innerHTML = (openForm && openForm.type === 'new')
      ? '' : '<div class="empty">No tracking data yet. Start tracking from Jiraffe!</div>';
    return;
  }

  const activeKey = lastData?.active?.key;
  let grandTotal = 0;
  trackersEl.innerHTML = keys.map(key => {
    const tracker = trackers[key];
    const isActive = key === activeKey;
    const elapsed = isActive ? computeElapsed() : 0;
    const isIdle = key === IDLE_KEY;
    const allSegs = tracker.segments || [];
    const segs = selectedDay
      ? allSegs.filter(s => localDateStr(new Date(s.started_at)) === selectedDay)
      : monthFilter
        ? allSegs.filter(s => localDateStr(new Date(s.started_at)).startsWith(monthFilter))
        : sprintFilter
          ? allSegs.filter(s => { const sr = sprintDateRange(); const d = localDateStr(new Date(s.started_at)); return sr && d >= sr.start && d <= sr.end; })
          : allSegs.filter(s => { const d = localDateStr(new Date(s.started_at)); return d >= weekRange.start && d <= weekRange.end; });
    const activeInFilter = isActive && lastData.active && (() => {
      if (selectedDay) return localDateStr(new Date(lastData.active.started_at)) === selectedDay;
      if (monthFilter) return localDateStr(new Date(lastData.active.started_at)).startsWith(monthFilter);
      if (sprintFilter) { const sr = sprintDateRange(); const d = localDateStr(new Date(lastData.active.started_at)); return !!sr && d >= sr.start && d <= sr.end; }
      const d = localDateStr(new Date(lastData.active.started_at));
      return d >= weekRange.start && d <= weekRange.end;
    })();
    const total = segs.reduce((sum, s) => sum + (s.seconds || 0), 0) + (activeInFilter ? elapsed : 0);
    grandTotal += total;
    const hasSegments = segs.length > 0 || isActive;
    const addingHere = openForm && openForm.type === 'add' && openForm.key === key;

    const segmentsHtml = segs.map(seg => {
      const editingThis = openForm && openForm.type === 'edit' && openForm.key === key && openForm.id === seg.id;
      if (editingThis) {
        return segFormHtml({
          onsave: `saveEdit('${esc(key)}','${esc(seg.id)}')`,
          start: toInputValue(seg.started_at),
          end: toInputValue(seg.ended_at),
        });
      }
      return `
        <div class="segment">
          <span class="segment-range">${formatDateTime(seg.started_at)} → ${formatDateTime(seg.ended_at)}</span>
          <span class="segment-right">
            <span class="segment-time">${formatTime(seg.seconds)}</span>
            <button class="seg-btn" title="Edit" onclick="openEdit('${esc(key)}','${esc(seg.id)}')">✎</button>
            <button class="seg-btn del" title="Delete" onclick="delSeg('${esc(key)}','${esc(seg.id)}')">✗</button>
          </span>
        </div>`;
    }).join('');

    // Active (in-progress) segment row — shown while this key is being tracked
    let activeSegHtml = '';
    if (isActive && lastData.active) {
      const editingActive = openForm && openForm.type === 'edit_active' && openForm.key === key;
      if (editingActive) {
        activeSegHtml = `
          <div class="seg-form" onkeydown="if(event.key==='Enter'){event.preventDefault();saveEditActive('${esc(key)}')}">
            <input type="datetime-local" id="f-active-start" value="${toInputValue(lastData.active.started_at)}">
            <span class="arrow">→ (tracking…)</span>
            <button class="seg-btn" onclick="saveEditActive('${esc(key)}')">Save</button>
            <button class="seg-btn" onclick="cancelForm()">Cancel</button>
            <span class="form-err" id="form-err"></span>
          </div>`;
      } else {
        activeSegHtml = `
          <div class="segment">
            <span class="segment-range">${formatDateTime(lastData.active.started_at)} → <span style="color:var(--green);">tracking…</span></span>
            <span class="segment-right">
              <span class="segment-time" id="active-seg-time">${formatTime(elapsed)}</span>
              <button class="seg-btn" title="Edit start time" onclick="openEditActive('${esc(key)}')">✎</button>
            </span>
          </div>`;
      }
    }

    const addHtml = addingHere
      ? segFormHtml({onsave:`saveAdd('${esc(key)}')`})
      : (!isActive ? `<button class="add-entry-btn" onclick="openAdd('${esc(key)}')">+ add entry</button>` : '');

    const isCollapsed = !expandedKeys.has(key);
    const totalId = isActive ? ' id="active-tracker-total"' : '';
    const displaySummary = jiraData?.issues?.find(i => i.key === key)?.summary
      || (tracker.summary !== key ? tracker.summary : '')
      || '';
    return `
      <div class="tracker-item ${isIdle ? 'idle-tracker' : ''}" data-tracker-key="${esc(key)}">
        <div class="tracker-header" onclick="toggleSegments(this)">
          <span class="tracker-toggle">${hasSegments || addingHere ? (isCollapsed ? '▸' : '▾') : ''}</span>
          <span class="tracker-key">${isIdle ? '⏸ IDLE' : esc(key)}</span>
          ${!isIdle && displaySummary ? `<span class="tracker-summary">${esc(displaySummary)}</span>` : ''}
          <div class="tracker-total"${totalId}>${formatTime(total)}</div>
          ${!isIdle ? `<button class="track-btn${isActive ? ' active' : ''}" onclick="event.stopPropagation();startTracking('${esc(key)}','${esc(displaySummary)}')">${isActive ? 'TRACKING' : 'Track'}</button>` : ''}
        </div>
        <div class="tracker-segments${isCollapsed ? ' collapsed' : ''}">
          ${activeSegHtml}
          ${segmentsHtml}
          ${addHtml}
        </div>
      </div>`;
  }).join('');

  renderDailyPanel();
}

function viewedWeekRange() {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7) + weekOffset * 7);
  monday.setHours(0, 0, 0, 0);
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  return { start: localDateStr(monday), end: localDateStr(friday) };
}

function viewedMonthYM() {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function computeMonthTotal() {
  if (!lastData) return 0;
  const ym = viewedMonthYM();
  let secs = 0;
  for (const tracker of Object.values(lastData.trackers || {})) {
    for (const seg of tracker.segments || []) {
      if (localDateStr(new Date(seg.started_at)).startsWith(ym)) secs += seg.seconds || 0;
    }
  }
  const active = lastData.active;
  if (active && monthOffset === 0 && localDateStr(new Date(active.started_at)).startsWith(ym)) secs += computeElapsed();
  return secs;
}

function sprintDateRange() {
  if (!jiraData?.sprint) return null;
  return { start: jiraData.sprint.start_date, end: jiraData.sprint.end_date };
}

function computeSprintTotal() {
  if (!lastData || !jiraData?.sprint) return 0;
  const sr = sprintDateRange();
  let secs = 0;
  for (const tracker of Object.values(lastData.trackers || {})) {
    for (const seg of tracker.segments || []) {
      const d = localDateStr(new Date(seg.started_at));
      if (d >= sr.start && d <= sr.end) secs += seg.seconds || 0;
    }
  }
  const active = lastData.active;
  if (active) {
    const d = localDateStr(new Date(active.started_at));
    if (d >= sr.start && d <= sr.end) secs += computeElapsed();
  }
  return secs;
}

function toggleSprintFilter() {
  if (!jiraData?.sprint) return;
  if (sprintFilter) {
    sprintFilter = false;
    document.getElementById('day-filter-banner').classList.add('hidden');
  } else {
    sprintFilter = true;
    selectedDay = null;
    monthFilter = null;
    const sr = sprintDateRange();
    const fmt = s => { const [,m,d] = s.split('-'); return `${d}/${m}`; };
    document.getElementById('day-filter-label').textContent = `SPRINT  ${fmt(sr.start)} – ${fmt(sr.end)}`;
    document.getElementById('day-filter-banner').classList.remove('hidden');
  }
  updateFilterStatusbar();
  renderDailyPanel();
  render();
}

function shiftWeek(delta) {
  weekOffset = Math.min(0, weekOffset + delta);
  renderDailyPanel();
  render();
}

function goToCurrentWeek() {
  weekOffset = 0;
  renderDailyPanel();
  render();
}

function shiftMonth(delta) {
  monthOffset = Math.min(0, monthOffset + delta);
  if (monthFilter) {
    monthFilter = viewedMonthYM();
    const [y, m] = monthFilter.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    const label = d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
    document.getElementById('day-filter-label').textContent = label;
    updateFilterStatusbar();
  }
  renderDailyPanel();
  render();
}

function goToCurrentMonth() {
  monthOffset = 0;
  if (monthFilter) {
    monthFilter = viewedMonthYM();
    const now = new Date();
    const label = now.toLocaleString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
    document.getElementById('day-filter-label').textContent = label;
    updateFilterStatusbar();
  }
  renderDailyPanel();
  render();
}

function updateFilterStatusbar() {
  const bar = document.getElementById('filter-statusbar');
  if (!bar) return;
  if (selectedDay) {
    const d = new Date(selectedDay + 'T12:00:00');
    const weekday = d.toLocaleString('en-GB', { weekday: 'long' }).toUpperCase();
    const day = String(d.getDate()).padStart(2, '0');
    const month = d.toLocaleString('en-GB', { month: 'long' }).toUpperCase();
    const year = d.getFullYear();
    bar.textContent = `${weekday}  ${day}  ${month}  ${year}`;
    bar.className = 'active';
  } else if (monthFilter) {
    const [y, m] = monthFilter.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    const month = d.toLocaleString('en-GB', { month: 'long' }).toUpperCase();
    bar.textContent = `${month}  ${y}`;
    bar.className = 'active';
  } else if (sprintFilter && jiraData?.sprint) {
    const sr = sprintDateRange();
    const fmt = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
    const name = jiraData.sprint.name ? `  ·  ${jiraData.sprint.name}` : '';
    bar.textContent = `SPRINT  ${fmt(sr.start)} – ${fmt(sr.end)}${name}`;
    bar.className = 'active';
  } else {
    bar.textContent = '';
    bar.className = 'hidden';
  }
}

function toggleMonthFilter() {
  const ym = viewedMonthYM();
  if (monthFilter === ym) {
    monthFilter = null;
    document.getElementById('day-filter-banner').classList.add('hidden');
  } else {
    monthFilter = ym;
    selectedDay = null;
    sprintFilter = false;
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    const label = d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
    document.getElementById('day-filter-label').textContent = label;
    document.getElementById('day-filter-banner').classList.remove('hidden');
  }
  updateFilterStatusbar();
  renderDailyPanel();
  render();
}

// ── day gap timeline ─────────────────────────────────────────────────────
// All segments (any tracker, including the live one) that started on dateStr,
// sorted by start time.
function computeDaySegments(dateStr) {
  const trackers = lastData?.trackers || {};
  const segs = [];
  for (const [key, tracker] of Object.entries(trackers)) {
    for (const s of tracker.segments || []) {
      if (localDateStr(new Date(s.started_at)) === dateStr) {
        segs.push({start: new Date(s.started_at), end: new Date(s.ended_at), key, isIdle: key === IDLE_KEY});
      }
    }
  }
  const active = lastData?.active;
  if (active && localDateStr(new Date(active.started_at)) === dateStr) {
    segs.push({start: new Date(active.started_at), end: new Date(), key: active.key, isIdle: active.key === IDLE_KEY});
  }
  segs.sort((a, b) => a.start - b.start);
  return segs;
}

const TL_GAP_THRESHOLD_MS = 5 * 60 * 1000; // ignore untracked slivers under 5 min

function renderDayTimeline() {
  const barEl = document.getElementById('day-timeline-bar');
  const gapsEl = document.getElementById('day-timeline-gaps');
  const summaryEl = document.getElementById('day-timeline-gaps-summary');
  const rangeEl = document.getElementById('day-timeline-range-labels');
  const labelEl = document.getElementById('day-timeline-label');
  if (!barEl || !lastData) return;

  const now = new Date();
  const todayStr = localDateStr(now);
  const dateStr = selectedDay || todayStr;
  labelEl.textContent = `GAPS · ${dateStr === todayStr ? 'TODAY' : dateStr}`;

  const segs = computeDaySegments(dateStr);
  if (segs.length === 0) {
    barEl.innerHTML = '';
    rangeEl.innerHTML = '';
    summaryEl.textContent = '';
    gapsEl.innerHTML = '<div class="timeline-empty">No tracked time this day.</div>';
    return;
  }

  const dayFloor = new Date(dateStr + 'T00:00:00');
  const workEnd = new Date(dayFloor.getTime() + 18 * 3600e3);
  const rangeStart = segs[0].start;
  const lastEnd = segs[segs.length - 1].end.getTime();
  const rangeEnd = dateStr === todayStr
    ? new Date(Math.max(lastEnd, Math.min(workEnd.getTime(), now.getTime())))
    : new Date(Math.max(lastEnd, workEnd.getTime()));
  const totalMs = rangeEnd - rangeStart;
  if (totalMs <= 0) { barEl.innerHTML = ''; rangeEl.innerHTML = ''; summaryEl.textContent = ''; gapsEl.innerHTML = ''; return; }

  const fmtHm = d => d.toLocaleTimeString('da-DK', {hour: '2-digit', minute: '2-digit'});

  const blocks = [];
  const gapRows = [];
  let cursor = rangeStart;
  for (const s of segs) {
    if (s.start - cursor >= TL_GAP_THRESHOLD_MS) {
      blocks.push({type: 'gap', start: cursor, end: s.start});
      gapRows.push({start: cursor, end: s.start});
    }
    blocks.push({type: s.isIdle ? 'idle' : 'tracked', start: s.start, end: s.end, key: s.key});
    if (s.end > cursor) cursor = s.end;
  }
  if (rangeEnd - cursor >= TL_GAP_THRESHOLD_MS) {
    blocks.push({type: 'gap', start: cursor, end: rangeEnd});
    gapRows.push({start: cursor, end: rangeEnd});
  }

  barEl.innerHTML = blocks.map(b => {
    const widthPct = Math.max(0.4, (b.end - b.start) / totalMs * 100);
    const mins = Math.round((b.end - b.start) / 60000);
    const cls = b.type === 'gap' ? 'tl-gap' : b.type === 'idle' ? 'tl-idle' : 'tl-tracked';
    const what = b.type === 'gap' ? 'Untracked' : (b.key === IDLE_KEY ? 'Idle' : b.key);
    const title = `${what} · ${fmtHm(b.start)}–${fmtHm(b.end)} (${mins}m)`;
    const onclick = b.type === 'gap'
      ? ` onclick="openNewEntry('${b.start.toISOString()}','${b.end.toISOString()}')"`
      : '';
    return `<div class="tl-block ${cls}" style="width:${widthPct}%" title="${esc(title)}"${onclick}></div>`;
  }).join('');

  rangeEl.innerHTML = `<span>${fmtHm(rangeStart)}</span><span>${fmtHm(rangeEnd)}</span>`;

  const totalGapMs = gapRows.reduce((sum, g) => sum + (g.end - g.start), 0);
  summaryEl.textContent = gapRows.length
    ? `${gapRows.length} gap${gapRows.length === 1 ? '' : 's'} · ${formatHm(Math.round(totalGapMs / 1000))} untracked`
    : 'No gaps 🎉';

  gapsEl.innerHTML = gapRows.map(g => {
    const mins = Math.round((g.end - g.start) / 60000);
    const dur = mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`;
    return `
      <div class="tl-gap-row" title="Fill this gap" onclick="openNewEntry('${g.start.toISOString()}','${g.end.toISOString()}')">
        <span>${fmtHm(g.start)} – ${fmtHm(g.end)}</span>
        <span class="tl-gap-dur">${dur}</span>
      </div>`;
  }).join('');
}

function selectDay(ds, label) {
  if (selectedDay === ds) { clearDayFilter(); return; }
  monthFilter = null;
  sprintFilter = false;
  selectedDay = ds;
  document.getElementById('day-filter-label').textContent = label;
  document.getElementById('day-filter-banner').classList.remove('hidden');
  updateFilterStatusbar();
  renderDailyPanel();
  render();
}

function clearDayFilter() {
  if (!selectedDay && !monthFilter && !sprintFilter) return;
  selectedDay = null;
  monthFilter = null;
  sprintFilter = false;
  document.getElementById('day-filter-banner').classList.add('hidden');
  updateFilterStatusbar();
  renderDailyPanel();
  render();
}

function renderDailyPanel() {
  if (!lastData) return;

  // Monday of the target week
  const now = new Date();
  const todayStr = localDateStr(now);
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7) + weekOffset * 7);
  monday.setHours(0, 0, 0, 0);

  // Build a map: 'key|localDateStr' -> raw seconds, then round each
  // (tracker, day) block to the nearest quarter-hour before summing into the
  // day total — same rule the worklog page applies, so the two pages agree.
  const perKeyDay = {};
  const trackers = lastData.trackers || {};
  const activeKey = lastData.active?.key;
  for (const [key, tracker] of Object.entries(trackers)) {
    for (const seg of tracker.segments || []) {
      const d = localDateStr(new Date(seg.started_at));
      const k = key + '|' + d;
      perKeyDay[k] = (perKeyDay[k] || 0) + (seg.seconds || 0);
    }
  }
  // Fold live elapsed for the active tracker into its own day block so it
  // rounds together with that tracker's other segments for today.
  if (activeKey && weekOffset === 0) {
    const k = activeKey + '|' + todayStr;
    perKeyDay[k] = (perKeyDay[k] || 0) + computeElapsed();
  }
  const dayTotals = {};
  for (const [k, secs] of Object.entries(perKeyDay)) {
    const d = k.slice(k.indexOf('|') + 1);
    dayTotals[d] = (dayTotals[d] || 0) + roundQuarter(secs);
  }

  const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
  let weekTotal = 0;
  let html = '';
  for (let i = 0; i < 5; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const ds = localDateStr(d);
    const secs = dayTotals[ds] || 0;
    weekTotal += secs;
    const isToday = ds === todayStr;
    const isSelected = ds === selectedDay;
    const label = `${DAY_NAMES[i]} ${String(d.getDate()).padStart(2, '0')}`;
    const timeStr = secs > 0 ? formatHm(secs) : '–';
    const mark = daySyncMarks[ds] === 'synced' ? ' <span class="day-mark-synced">✓</span>'
               : daySyncMarks[ds] === 'pending' ? ' <span class="day-mark-pending">●</span>' : '';
    const classes = ['day-box', isToday ? 'today' : '', isSelected ? 'selected' : ''].filter(Boolean).join(' ');
    html += `<div class="${classes}" onclick="selectDay('${ds}','${label}')">
      <span class="day-label">${label}</span>
      <span class="day-total${secs === 0 ? ' empty' : ''}">${timeStr}${mark}</span>
    </div>`;
  }
  document.getElementById('day-boxes').innerHTML = html;

  const weekTotalVal = document.getElementById('week-total-val');
  if (weekTotalVal) {
    weekTotalVal.textContent = weekTotal > 0 ? formatHm(weekTotal) : '–';
    weekTotalVal.className = 'day-total' + (weekTotal === 0 ? ' empty' : '');
  }
  const weekBox = document.getElementById('week-total-box');
  if (weekBox) {
    weekBox.style.borderColor = weekTotal > 0 ? 'var(--green)' : 'var(--border)';
    weekBox.style.background = weekTotal > 0 ? 'rgba(110,212,100,0.04)' : 'var(--panel)';
  }

  const weekStart = monday;
  const weekEnd = new Date(monday);
  weekEnd.setDate(monday.getDate() + 4);
  const fmt = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('week-label').textContent =
    weekOffset === 0 ? 'THIS WEEK' : `${fmt(weekStart)}–${fmt(weekEnd)}`;
  document.getElementById('btn-next-week').disabled = weekOffset === 0;

  const ffBtn = document.getElementById('btn-fast-forward');
  if (ffBtn) ffBtn.style.display = weekOffset < 0 ? '' : 'none';

  document.getElementById('week-total-box').onclick = () => openJiraSync(viewedWeekRange());

  // month nav
  const ym = viewedMonthYM();
  const [my, mm] = ym.split('-').map(Number);
  const mDate = new Date(my, mm - 1, 1);
  document.getElementById('month-nav-label').textContent =
    mDate.toLocaleString('en-GB', { month: 'long', year: 'numeric' }).toUpperCase();
  document.getElementById('btn-next-month').disabled = monthOffset === 0;
  const ffMonthBtn = document.getElementById('btn-fast-forward-month');
  if (ffMonthBtn) ffMonthBtn.style.display = monthOffset < 0 ? '' : 'none';

  const monthSecs = computeMonthTotal();
  const monthVal = document.getElementById('month-total-val');
  if (monthVal) {
    monthVal.textContent = monthSecs > 0 ? formatHm(monthSecs) : '–';
    monthVal.className = 'day-total' + (monthSecs === 0 ? ' empty' : '');
  }

  const monthBox = document.getElementById('month-total-box');
  const monthLbl = document.getElementById('month-label');
  if (monthBox) {
    const isActiveMonth = monthFilter && monthFilter === ym;
    monthBox.style.borderColor = isActiveMonth ? 'var(--bright)' : 'var(--border)';
    monthBox.style.background = isActiveMonth ? 'var(--sel-bg)' : 'var(--panel)';
    if (monthLbl) monthLbl.style.color = isActiveMonth ? 'var(--bright)' : 'var(--dim)';
  }

  const sprintBox = document.getElementById('sprint-total-box');
  const sprintLbl = document.getElementById('sprint-label');
  const sprintVal = document.getElementById('sprint-total-val');
  if (sprintBox && jiraData?.sprint) {
    const sprintSecs = computeSprintTotal();
    if (sprintVal) {
      sprintVal.textContent = sprintSecs > 0 ? formatHm(sprintSecs) : '–';
      sprintVal.className = 'day-total' + (sprintSecs === 0 ? ' empty' : '');
    }
    sprintBox.style.borderColor = sprintFilter ? 'var(--bright)' : 'var(--border)';
    sprintBox.style.background = sprintFilter ? 'var(--sel-bg)' : 'var(--panel)';
    if (sprintLbl) sprintLbl.style.color = sprintFilter ? 'var(--bright)' : 'var(--dim)';
  }
}

// ── Jira worklog sync ───────────────────────────────────────────────────────
let jiraStatus = null;     // last /api/worklog-status response
let jiraBusy = false;
let daySyncMarks = {};     // dateStr -> 'synced' | 'pending'

function currentRange() {
  if (selectedDay) return {start: selectedDay, end: selectedDay};
  if (monthFilter) {
    const [y, m] = monthFilter.split('-').map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    return { start: `${monthFilter}-01`, end: `${monthFilter}-${String(lastDay).padStart(2,'0')}` };
  }
  if (sprintFilter) {
    const sr = sprintDateRange();
    if (sr) return sr;
  }
  return viewedWeekRange();
}

function showJiraModal(html) {
  document.getElementById('jira-modal-box').innerHTML = html;
  document.getElementById('jira-modal').classList.remove('hidden');
}

function closeJiraModal() {
  document.getElementById('jira-modal').classList.add('hidden');
}

async function fetchJiraStatus(start, end) {
  const resp = await fetch(`/api/worklog-status?start=${start}&end=${end}`, {cache: 'no-store'});
  if (!resp.ok) throw new Error(await resp.text());
  return resp.json();
}

async function openJiraSync(range) {
  if (!range) range = currentRange();
  showJiraModal('<div class="empty">Fetching Jira worklogs…</div>');
  try {
    jiraStatus = await fetchJiraStatus(range.start, range.end);
    renderJiraModal();
    updateDayMarks();
  } catch (e) {
    showJiraModal(`<div class="empty">⚠ ${esc(e.message)}</div>
      <div style="text-align:right;"><button class="btn" onclick="closeJiraModal()">Close</button></div>`);
  }
}

function jiraModalHead(start, end) {
  return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
    <span style="color:var(--bright);font-size:20px;letter-spacing:1px;">JIRA WORKLOG — ${start}${end !== start ? ` → ${end}` : ''}</span>
    <button class="seg-btn" onclick="closeJiraModal()">✕</button>
  </div>`;
}

function jiraModalWarnings(s) {
  let html = '';
  if (s.active) html += `<div style="color:var(--yellow);margin-bottom:8px;">⚠ Tracking ${esc(s.active.key)} — running time for ${s.active.date} is not included.</div>`;
  if ((s.invalid_keys || []).length) html += `<div style="color:var(--dim);margin-bottom:8px;">Skipped non-Jira keys: ${s.invalid_keys.map(esc).join(', ')}</div>`;
  return html;
}

function syncStateHtml(e) {
  switch (e.state) {
    case 'unwritten': return `→ will write ${formatHm(e.rounded_seconds)}`;
    case 'synced':    return `✓ written ${formatHm(e.rounded_seconds)}`;
    case 'changed':   return `${formatHm(e.ledger_seconds || 0)} → ${formatHm(e.rounded_seconds)} (will update)`;
    case 'conflict':  return `⚠ Jira already has ${formatHm(e.jira_seconds)} (not written by this tool)`;
    case 'orphaned':  return `⚠ wrote ${formatHm(e.ledger_seconds || 0)} but local time is gone — fix in Jira`;
    case 'error':     return `⚠ ${esc(e.error || 'Jira error')}`;
    default:          return esc(e.state);
  }
}

function syncRowHtml(e) {
  return `<div class="sync-row">
    <span class="sync-date">${e.date}</span>
    <span class="sync-key">${esc(e.key)}</span>
    <span class="sync-local">${formatHm(e.local_seconds)}</span>
    <span class="sync-state-${e.state}">${syncStateHtml(e)}</span>
  </div>`;
}

function renderJiraModal() {
  const s = jiraStatus;
  const writable = s.entries.filter(e => e.state === 'unwritten' || e.state === 'changed');
  const rows = s.entries.length
    ? s.entries.map(syncRowHtml).join('')
    : '<div class="empty">Nothing to write in this range.</div>';
  const foot = writable.length
    ? `<div style="margin-top:14px;text-align:right;">
        <button class="btn" id="btn-write-go" onclick="writeJira()">⇪ Write ${writable.length} ${writable.length === 1 ? 'entry' : 'entries'} to Jira</button>
      </div>`
    : '';
  showJiraModal(jiraModalHead(s.start, s.end) + jiraModalWarnings(s) + rows + foot);
}

function resultRowHtml(r) {
  const label = {
    created:  `✓ created ${formatHm(r.rounded_seconds)}`,
    updated:  `✓ updated to ${formatHm(r.rounded_seconds)}`,
    skipped:  `– already written`,
    conflict: `⚠ conflict — Jira has ${formatHm(r.jira_seconds)} not written by this tool`,
    orphaned: `⚠ orphaned — fix in Jira`,
    error:    `✗ ${esc(r.error || 'Jira error')}`,
  }[r.action] || esc(r.action);
  return `<div class="sync-row">
    <span class="sync-date">${r.date}</span>
    <span class="sync-key">${esc(r.key)}</span>
    <span class="sync-local">${formatHm(r.local_seconds)}</span>
    <span class="sync-action-${r.action}">${label}</span>
  </div>`;
}

async function writeJira() {
  if (jiraBusy || !jiraStatus) return;
  jiraBusy = true;
  const btn = document.getElementById('btn-write-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Writing…'; }
  try {
    const resp = await fetch('/api/worklog-write', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({start: jiraStatus.start, end: jiraStatus.end}),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    const rows = data.results.map(resultRowHtml).join('') || '<div class="empty">Nothing to write.</div>';
    showJiraModal(jiraModalHead(data.start, data.end) + jiraModalWarnings(data) + rows +
      `<div style="margin-top:14px;text-align:right;"><button class="btn" onclick="closeJiraModal()">Close</button></div>`);
    // refresh marks from the post-write state
    jiraStatus = await fetchJiraStatus(data.start, data.end);
    updateDayMarks();
  } catch (e) {
    showJiraModal(jiraModalHead(jiraStatus.start, jiraStatus.end) +
      `<div class="empty">⚠ Write failed: ${esc(e.message)}</div>
      <div style="text-align:right;"><button class="btn" onclick="closeJiraModal()">Close</button></div>`);
  } finally {
    jiraBusy = false;
  }
}

function updateDayMarks() {
  daySyncMarks = {};
  if (!jiraStatus) return;
  for (const e of jiraStatus.entries) {
    if (e.state === 'synced') {
      if (!daySyncMarks[e.date]) daySyncMarks[e.date] = 'synced';
    } else {
      daySyncMarks[e.date] = 'pending';
    }
  }
  renderDailyPanel();
}

function localDateStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function formatHm(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return `${h}h ${m}m`;
}

function toggleSegments(headerEl) {
  const item = headerEl.closest('.tracker-item');
  const segmentsEl = item.querySelector('.tracker-segments');
  if (!segmentsEl) return;
  const key = item.dataset.trackerKey;
  const collapsed = segmentsEl.classList.toggle('collapsed');
  if (key) collapsed ? expandedKeys.delete(key) : expandedKeys.add(key);
  const toggleEl = headerEl.querySelector('.tracker-toggle');
  if (toggleEl && toggleEl.textContent.trim()) toggleEl.textContent = collapsed ? '▸' : '▾';
}

async function loadAndRender() {
  try {
    const [ttResp, jResp] = await Promise.all([
      fetch('data/timetrack.json', {cache:'no-store'}),
      fetch('data/jira.json', {cache:'no-store'}).catch(() => null),
    ]);
    if (!ttResp.ok) throw new Error('No tracking data yet');
    lastData = await ttResp.json();
    if (jResp?.ok) jiraData = await jResp.json();
    const sprintBox = document.getElementById('sprint-total-box');
    if (sprintBox) sprintBox.style.display = jiraData?.sprint ? '' : 'none';
    renderActiveBanner();
    render();
  } catch (e) {
    document.getElementById('trackers').innerHTML = `<div class="empty">⚠ ${esc(e.message)}</div>`;
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    document.getElementById('active-banner').classList.add('hidden');
    console.error('load timesheet:', e);
  }
}

loadAndRender();
// auto-refresh, but never while a form is open (would wipe the user's input)
setInterval(() => { if (!openForm) loadAndRender(); }, 5000);

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('jira-modal').classList.contains('hidden')) { closeJiraModal(); return; }
  clearDayFilter();
});
document.addEventListener('mousedown', e => {
  if (!selectedDay && !monthFilter && !sprintFilter) return;
  if (!e.target.closest('#daily-panel') && !e.target.closest('#day-filter-banner')
      && !e.target.closest('#main-col') && !e.target.closest('#jira-modal')) {
    clearDayFilter();
  }
});
</script>

  (function () {
    function loadCopilotNav() {
      fetch('data/copilot.json', {cache:'no-store'}).then(r => r.json()).then(d => {
        const el = document.getElementById('nav-copilot-total');
        if (el) el.textContent = (d.my_month_total ?? 0).toLocaleString();
      }).catch(() => {});
    }
    loadCopilotNav();
    setInterval(loadCopilotNav, 5 * 60 * 1000);
  })();
</script>
