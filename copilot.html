<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot — Jiraffe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Kalam:wght@300;400;700&family=Permanent+Marker&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Theme extras — page-specific variables per theme (core palette lives in
       theme.css, shared by every page). */
    :root,
    [data-theme="amber"] {
      --sel-bg:rgba(255,212,85,0.07); --hover-bg:rgba(212,135,10,0.04); --row-border-soft:rgba(138,85,0,0.30); --dim-faint:rgba(138,85,0,0.50); --overlay:rgba(0,0,0,0.75); --scanline:rgba(0,0,0,0.07); --scanline-step:4px;
      --bar:var(--border);  /* history chart bars; paper/c64 need --dim for 3:1 contrast */
    }
    [data-theme="green"] {
      --sel-bg:rgba(157,255,176,0.08); --hover-bg:rgba(40,200,90,0.05); --row-border-soft:rgba(20,90,40,0.30); --dim-faint:rgba(63,208,106,0.40); --overlay:rgba(0,0,0,0.78); --scanline:rgba(0,0,0,0.14); --scanline-step:3px;
    }
    [data-theme="ice"] {
      --sel-bg:rgba(184,240,255,0.08); --hover-bg:rgba(40,150,200,0.05); --row-border-soft:rgba(20,80,110,0.30); --dim-faint:rgba(82,184,216,0.40); --overlay:rgba(0,8,16,0.78); --scanline:rgba(0,0,0,0.05); --scanline-step:6px;
    }
    [data-theme="paper"] {
      --sel-bg:rgba(120,90,30,0.10); --hover-bg:rgba(120,90,30,0.06); --row-border-soft:rgba(120,100,60,0.25); --dim-faint:rgba(122,106,69,0.50); --overlay:rgba(40,35,25,0.55); --scanline:rgba(0,0,0,0.015); --scanline-step:8px;
      --bar:var(--dim);
    }
    [data-theme="c64"] {
      --sel-bg:rgba(180,170,245,0.12); --hover-bg:rgba(150,135,230,0.14); --row-border-soft:rgba(120,105,196,0.30); --dim-faint:rgba(155,143,224,0.45); --overlay:rgba(18,10,55,0.80); --scanline:rgba(0,0,0,0.10); --scanline-step:3px;
      --bar:var(--dim);
    }
    [data-theme="board"] {
      --sel-bg:rgba(168,120,15,0.16); --hover-bg:rgba(90,65,35,0.10); --row-border-soft:rgba(90,65,35,0.22); --dim-faint:rgba(92,74,48,0.50); --overlay:rgba(40,30,18,0.55); --scanline:rgba(0,0,0,0); --scanline-step:8px;
    }
    [data-theme="board"] body {
      background-color:#c2a173;
      background-image:
        radial-gradient(circle at 18% 28%, rgba(108,74,40,0.22) 0 1.5px, transparent 2px),
        radial-gradient(circle at 63% 54%, rgba(92,60,28,0.18) 0 1.5px, transparent 2px),
        radial-gradient(circle at 82% 20%, rgba(132,96,56,0.20) 0 1.5px, transparent 2px),
        radial-gradient(circle at 40% 82%, rgba(88,56,26,0.20) 0 1.5px, transparent 2px),
        radial-gradient(circle at 90% 75%, rgba(120,86,48,0.16) 0 1.5px, transparent 2px);
      background-size:23px 23px,17px 17px,29px 29px,19px 19px,13px 13px;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text); font-family:var(--font); text-shadow:var(--glow,none);
      font-size:18px; padding:calc(20px + var(--frame-w, 0px)); line-height:1.6;
    }
    body::after {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:9999;
      background:repeating-linear-gradient(0deg,
        transparent, transparent calc(var(--scanline-step,4px)/2),
        var(--scanline) calc(var(--scanline-step,4px)/2), var(--scanline) var(--scanline-step,4px));
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:9998;
      border:var(--frame-w,0px) solid var(--frame-c,transparent);
    }

    header { margin-bottom:18px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
    h1 { color:var(--bright); font-size:28px; letter-spacing:2px; font-family:var(--font-display); text-transform:var(--case,none); min-width:320px; flex-shrink:0; }
    .nav-link { color:var(--dim); text-decoration:none; font-size:16px; }
    .nav-link:hover { color:var(--bright); }
    #updated { color:var(--dim-faint); font-size:14px; }

    /* shared cross-page navbar */
    .page-nav { display:flex; gap:4px; flex-wrap:wrap; align-items:center; flex-shrink:0; }
    .page-nav a { color:var(--dim); text-decoration:none; font-size:15px; letter-spacing:1px; padding:4px 10px; border:1px solid transparent; }
    .page-nav a:hover { color:var(--bright); border-color:var(--border); }
    .page-nav a.active { color:var(--bright); border-color:var(--border); background:var(--sel-bg); }

    #refresh-btn {
      background:none; border:1px solid var(--border); color:var(--text); font-family:inherit;
      font-size:17px; padding:3px 10px; cursor:pointer; flex-shrink:0; letter-spacing:1px;
    }
    #refresh-btn:hover { border-color:var(--bright); color:var(--bright); }
    #refresh-btn:disabled { opacity:0.5; cursor:default; }

    #summary { color:var(--dim); font-size:15px; margin-bottom:16px; }
    #summary strong { color:var(--text); }

    #only-me-label {
      display:flex; align-items:center; gap:6px; color:var(--dim); font-size:15px;
      cursor:pointer; user-select:none; flex-shrink:0;
    }
    #only-me-label:hover { color:var(--bright); }

    /* my daily credits over time: context bars + 7-day average accent line */
    #history {
      position:relative; margin-bottom:18px;
      border:1px solid var(--border); background:var(--panel); padding:10px 14px 4px;
    }
    .hist-head { display:flex; align-items:baseline; gap:4px 18px; flex-wrap:wrap; margin-bottom:6px; }
    .hist-title { color:var(--bright); font-size:15px; letter-spacing:1px; }
    .hist-stat { color:var(--dim); font-size:14px; }
    .hist-stat b { color:var(--text); font-weight:600; }
    .hist-legend { margin-left:auto; display:flex; gap:14px; align-items:center; color:var(--dim); font-size:13px; }
    .hist-legend a { color:var(--dim); }
    .key { display:inline-block; margin-right:6px; vertical-align:middle; }
    .key.bar { width:8px; height:12px; background:var(--bar); border-radius:2px 2px 0 0; }
    .key.line { width:16px; height:2px; background:var(--bright); }
    .hist-chart svg { display:block; overflow:visible; }
    .h-grid { stroke:var(--row-border-soft); shape-rendering:crispEdges; }
    .h-tick { fill:var(--dim); font-size:13px; font-family:var(--font); }
    .h-gap { fill:var(--sel-bg); }
    .h-bar { fill:var(--bar); }
    .h-bar.on { fill:var(--text); }
    .h-avg { fill:none; stroke:var(--bright); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .h-xhair { stroke:var(--dim); shape-rendering:crispEdges; }
    #hist-tip {
      position:absolute; z-index:5; pointer-events:none; white-space:nowrap;
      background:var(--bg); border:1px solid var(--border); padding:4px 10px; font-size:14px; color:var(--dim);
    }
    #hist-tip b { color:var(--bright); font-size:16px; }

    .rows { border:1px solid var(--border); overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:16px; white-space:nowrap; }
    th, td { padding:7px 12px; text-align:right; border-bottom:1px solid var(--row-border-soft); }
    th:first-child, td:first-child { text-align:left; }
    thead th { color:var(--dim); font-size:14px; letter-spacing:0.5px; border-bottom:1px solid var(--border); }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:var(--hover-bg); }
    td.user, th:first-child { color:var(--text); }
    td.total { color:var(--bright); font-weight:600; }
    td.zero { color:var(--dim-faint); }
    td.empty-cell { color:var(--dim-faint); }

    tr.row-all td { color:var(--dim); font-style:italic; border-bottom:1px solid var(--border); }
    tr.row-all td.total { color:var(--dim); }

    tr.row-me td { background:var(--sel-bg); }
    tr.row-me td.user { color:var(--bright); font-weight:600; }
    tr.row-me td.user::before { content:"▸ "; }
    tr.row-me td.total { color:var(--green); }

    .empty { color:var(--dim); font-size:15px; max-width:680px; line-height:1.5; }
    .empty code { color:var(--bright); }
  </style>
  <script src="theme.js"></script>
</head>
<body>

<header>
  <h1>🤖 COPILOT</h1>
  <nav class="page-nav">
    <a href="index.html">◆ DASHBOARD</a>
    <a href="time.html">⏱ TIMESHEET</a>
    <a href="worklog.html">💰 WORKLOG</a>
    <a href="leave.html">🌴 FERIE</a>
    <a href="jenkins.html">🔧 JENKINS</a>
    <a href="versions.html">📦 VERSIONS</a>
    <a href="copilot.html" class="active">🤖 COPILOT <span id="nav-copilot-total">–</span></a>
    <a href="backlog.html">🗒 BACKLOG</a>
    <a href="links.html">🔗 LINKS</a>
  </nav>
  <label id="only-me-label"><input type="checkbox" id="only-me-toggle" onchange="onOnlyMeChange()"> only me</label>
  <button id="refresh-btn" onclick="triggerPoll()">⟳ REFRESH</button>
  <span id="updated"></span>
</header>

<div id="summary"></div>
<div id="history" hidden></div>
<div id="content">Loading…</div>

<script>
const el = id => document.getElementById(id);
const BASE_TITLE = 'Copilot — Jiraffe';

function relTime(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'just now';
  const m = s / 60; if (m < 60) return `${Math.round(m)}m ago`;
  const h = m / 60; if (h < 24) return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(n) { return n == null ? '' : n.toLocaleString(); }

const ONLY_ME_KEY = 'jiraffe-copilot-only-me';
let lastData = null;

// ── my daily credits over time ──
// data/copilot-history.json (day -> credits) is kept by scripts/copilot-history.py
// from copilot-leaderboard's archive. A day missing from it has no data (the
// poller was off), drawn as a gap, never as a zero.
const DAY_MS = 86400000;
let history = {}, series = [], geo = null;

function dailySeries(hist) {
  const days = Object.keys(hist).sort();
  const out = [];
  if (!days.length) return out;
  for (let t = Date.parse(days[0]); t <= Date.parse(days.at(-1)); t += DAY_MS) {
    const day = new Date(t).toISOString().slice(0, 10);
    out.push({day, v: hist[day] ?? null});
  }
  // 7-day rolling average over 7 known days only, so the line breaks at a gap
  out.forEach((p, i) => {
    const win = out.slice(Math.max(0, i - 6), i + 1);
    p.avg = win.length === 7 && win.every(q => q.v != null) ? win.reduce((s, q) => s + q.v, 0) / 7 : null;
  });
  return out;
}

// per-day mean over the known days, or null when fewer than 14 are known
function meanPerDay(pts) {
  const v = pts.filter(p => p.v != null).map(p => p.v);
  return v.length >= 14 ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

function niceStep(max) {
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
}

// 4px rounded data end, square at the baseline
function barPath(x, w, yTop, yBase) {
  const r = Math.min(4, w / 2, yBase - yTop);
  return `M${x},${yBase}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + w - r}Q${x + w},${yTop} ${x + w},${yTop + r}V${yBase}Z`;
}

const dayLabel = (day, opts) => new Date(day + 'T00:00:00Z').toLocaleDateString('en-GB', {...opts, timeZone: 'UTC'});

// ponytail: one bar per day for the whole history; switch to weekly bars once it passes ~a year
function historySvg(width) {
  const H = 170, L = 56, R = 6, T = 8, B = 24;   // insets: y ticks left, month labels below
  const pw = width - L - R, ph = H - T - B, n = series.length;
  const max = Math.max(1, ...series.map(p => p.v || 0));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const slot = pw / n, bw = Math.max(1, Math.min(24, slot - 2));
  const y = v => T + ph - v / top * ph;
  geo = {L, T, ph, slot};
  let s = '';
  for (let v = 0; v <= top; v += step) {
    s += `<line class="h-grid" x1="${L}" x2="${width - R}" y1="${y(v)}" y2="${y(v)}"/>`
      + `<text class="h-tick" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  // months along the bottom, each label centred under its own days
  const months = [];
  series.forEach((p, i) => {
    const m = p.day.slice(0, 7);
    if (months.at(-1)?.m === m) months.at(-1).to = i; else months.push({m, from: i, to: i});
  });
  months.forEach((g, k) => {
    const x0 = L + g.from * slot, w = (g.to - g.from + 1) * slot;
    if (k) s += `<line class="h-grid" x1="${x0}" x2="${x0}" y1="${T + ph}" y2="${H - 4}"/>`;
    const label = dayLabel(g.m + '-01', {month: 'short'}).slice(0, 3) + (k === 0 || g.m.endsWith('-01') ? ' ' + g.m.slice(0, 4) : '');
    if (w >= 40) s += `<text class="h-tick" x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${label}</text>`;
  });
  // runs of days with no data
  let gapFrom = null;
  series.forEach((p, i) => {
    if (p.v == null) { gapFrom ??= i; return; }
    if (gapFrom == null) return;
    const x0 = L + gapFrom * slot, w = (i - gapFrom) * slot;
    s += `<rect class="h-gap" x="${x0}" y="${T}" width="${w}" height="${ph}"/>`
      + (w >= 60 ? `<text class="h-tick" x="${x0 + w / 2}" y="${T + ph / 2}" text-anchor="middle">no data</text>` : '');
    gapFrom = null;
  });
  series.forEach((p, i) => {
    if (p.v > 0) s += `<path class="h-bar" data-i="${i}" d="${barPath(L + i * slot + (slot - bw) / 2, bw, y(p.v), y(0))}"/>`;
  });
  let line = '', pen = false;
  series.forEach((p, i) => {
    if (p.avg == null) { pen = false; return; }
    line += `${pen ? 'L' : 'M'}${(L + (i + 0.5) * slot).toFixed(1)},${y(p.avg).toFixed(1)}`;
    pen = true;
  });
  s += `<path class="h-avg" d="${line}"/><line class="h-xhair" y1="${T}" y2="${T + ph}" visibility="hidden"/>`;
  const last = series.at(-1);
  return `<svg width="${width}" height="${H}" role="img" aria-label="My daily AI credits, ${esc(dayLabel(series[0].day, {dateStyle: 'medium'}))}`
    + ` to ${esc(dayLabel(last.day, {dateStyle: 'medium'}))}${last.avg != null ? `, 7-day average now ${fmt(Math.round(last.avg))}` : ''}">${s}</svg>`;
}

function renderHistory() {
  const box = el('history');
  series = dailySeries(history);
  box.hidden = !series.length;
  if (!series.length) return;
  const recent = meanPerDay(series.slice(-28)), before = meanPerDay(series.slice(-56, -28));
  const delta = recent != null && before ? Math.round((recent / before - 1) * 100) : null;
  box.innerHTML = `
    <div class="hist-head">
      <span class="hist-title">MY DAILY AI CREDITS</span>
      <span class="hist-stat">this month <b>${fmt(lastData?.my_month_total)}</b></span>
      ${recent != null ? `<span class="hist-stat">last 28 days <b>${fmt(Math.round(recent))}</b>/day${delta != null
        ? ` · <b>${delta >= 0 ? '↑' : '↓'} ${Math.abs(delta)}%</b> vs the 28 before` : ''}</span>` : ''}
      <span class="hist-legend">
        <span><i class="key bar"></i>daily</span>
        <span><i class="key line"></i>7-day average</span>
        <a href="data/copilot-history.json" target="_blank" rel="noopener" title="every saved day as JSON">data ↗</a>
      </span>
    </div>
    <div class="hist-chart"></div>
    <div id="hist-tip" hidden></div>`;
  const chart = box.querySelector('.hist-chart');
  chart.innerHTML = historySvg(chart.clientWidth);
}

// crosshair + tooltip: snaps to the nearest day, so a thin bar needn't be hit dead-on
el('history').addEventListener('pointermove', e => {
  const svg = el('history').querySelector('svg');
  if (!svg || !geo) return;
  const r = svg.getBoundingClientRect(), box = el('history').getBoundingClientRect();
  const i = Math.floor((e.clientX - r.left - geo.L) / geo.slot);
  const p = series[i], tip = el('hist-tip'), xh = svg.querySelector('.h-xhair');
  svg.querySelector('.h-bar.on')?.classList.remove('on');
  if (!p || e.clientY > r.top + geo.T + geo.ph) { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); return; }
  const x = geo.L + (i + 0.5) * geo.slot;
  xh.setAttribute('x1', x);
  xh.setAttribute('x2', x);
  xh.setAttribute('visibility', 'visible');
  svg.querySelector(`.h-bar[data-i="${i}"]`)?.classList.add('on');
  tip.innerHTML = `<b>${p.v == null ? 'no data' : `${fmt(p.v)} credits`}</b><br>`
    + esc(dayLabel(p.day, {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'}))
    + (p.avg != null ? ` · 7-day avg ${fmt(Math.round(p.avg))}` : '');
  tip.hidden = false;
  const left = r.left - box.left + x;
  tip.style.left = `${left + 12 + tip.offsetWidth > box.width ? left - 12 - tip.offsetWidth : left + 12}px`;
  tip.style.top = `${r.top - box.top + geo.T}px`;
});
el('history').addEventListener('pointerleave', () => {
  el('hist-tip')?.setAttribute('hidden', '');
  el('history').querySelector('.h-xhair')?.setAttribute('visibility', 'hidden');
  el('history').querySelector('.h-bar.on')?.classList.remove('on');
});
window.addEventListener('resize', () => { if (series.length) renderHistory(); });

function render(data) {
  lastData = data;
  const allUsers = data.users || [];
  if (!allUsers.length) {
    el('content').innerHTML = `<div class="empty">No <code>data/copilot.json</code> yet — let
      <code>scripts/poll-copilot.sh</code> run once (it fires every 4h via launchd).</div>`;
    document.title = BASE_TITLE;
    return;
  }

  el('updated').textContent = data.updated ? 'updated ' + relTime(data.updated) : '';
  document.title = data.my_month_total != null ? `(${data.my_month_total}) ${BASE_TITLE}` : BASE_TITLE;

  const navEl = el('nav-copilot-total');
  if (navEl) navEl.textContent = fmt(data.my_month_total ?? 0);

  el('summary').innerHTML = `<strong>${esc(data.org || '')}</strong> — ${esc(data.month_label || '')}
    ${data.summary ? ' · ' + esc(data.summary) : ''}`;

  const onlyMe = el('only-me-toggle').checked;
  const users = onlyMe ? allUsers.filter(u => u.user === data.my_user || u.user === 'All') : allUsers;

  const dayCols = data.day_columns || [];
  // share of the org's monthly credit pool (COPILOT_POOL in secrets/config); the "All" row is the pool used so far
  const pool = data.pool;
  // share of everything used this month (the "All" row's total)
  const used = allUsers.find(u => u.user === 'All')?.month_total;
  const pct = (n, of) => `<td class="${n ? '' : 'zero'}">${(n / of * 100).toFixed(1)}%</td>`;
  const header = `<tr><th>User</th><th>Month total</th>${used ? '<th>% of total</th>' : ''}${pool ? `<th title="of ${fmt(pool)} credits">% of pool</th>` : ''}${dayCols.map(d => `<th>${esc(d)}</th>`).join('')}</tr>`;

  const rows = users.map(u => {
    const cls = u.user === 'All' ? 'row-all' : (u.user === data.my_user ? 'row-me' : '');
    const cells = dayCols.map((_, i) => {
      const v = u.daily[i];
      if (v == null) return `<td class="empty-cell">–</td>`;
      return `<td class="${v === 0 ? 'zero' : ''}">${fmt(v)}</td>`;
    }).join('');
    return `<tr class="${cls}"><td class="user">${esc(u.user)}</td><td class="total">${fmt(u.month_total)}</td>${used ? pct(u.month_total, used) : ''}${pool ? pct(u.month_total, pool) : ''}${cells}</tr>`;
  }).join('');

  el('content').innerHTML = `<div class="rows"><table><thead>${header}</thead><tbody>${rows}</tbody></table></div>`;
}

function onOnlyMeChange() {
  try { localStorage.setItem(ONLY_ME_KEY, el('only-me-toggle').checked ? '1' : '0'); } catch (e) {}
  if (lastData) render(lastData);
}

async function load() {
  try {
    const [data, hist] = await Promise.all(['data/copilot.json', 'data/copilot-history.json']
      .map(f => fetch(f, {cache: 'no-store'}).then(r => r.ok ? r.json() : {})));
    history = hist;
    render(data);
    renderHistory();
  } catch (e) {
    el('content').innerHTML = `<div class="empty">No <code>data/copilot.json</code> yet — let
      <code>scripts/poll-copilot.sh</code> run once (it fires every 4h via launchd).</div>`;
    document.title = BASE_TITLE;
  }
}

// Manual REFRESH: force a real backend poll (poll-copilot.sh one-shot), then reload.
async function triggerPoll() {
  const btn = el('refresh-btn');
  const prevLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⟳ POLLING…';
  el('updated').textContent = 'polling…';
  try {
    const r = await fetch('/api/poll-copilot', {method: 'POST'});
    if (!r.ok) console.error('poll-copilot failed:', await r.text());
  } catch (e) {
    console.error('poll-copilot request error:', e);
  } finally {
    btn.disabled = false;
    btn.textContent = prevLabel;
    load();
  }
}

try { el('only-me-toggle').checked = localStorage.getItem(ONLY_ME_KEY) === '1'; } catch (e) {}
load();
setInterval(load, 5 * 60 * 1000);   // poller runs every ~4h; this just catches up after a manual run
</script>
</body>
